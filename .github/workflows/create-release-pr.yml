name: Create Release PR

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release-pr:
    timeout-minutes: 30
    runs-on: ubuntu-latest
    steps:
      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.APP_CLIENT_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 # karinto: ignore[checkout-persist-credentials-false,artipacked] changesets pushes release commits with checkout credentials
        with:
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}

      - name: Install deps
        uses: ./.github/actions/install-deps

      - name: Create Release Pull Request
        uses: changesets/action@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2
        with:
          pr-title: 'chore: release lines-db'
          commit-message: 'chore: version packages'
          version-script: pnpm changeset version
          create-github-releases: true
          github-token: ${{ steps.app-token.outputs.token }}
