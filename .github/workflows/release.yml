name: Release to npm

on:
  pull_request:
    types: [closed]
    branches:
      - main

permissions:
  contents: write
  id-token: write

jobs:
  release:
    if: >-
      github.event.pull_request.merged == true &&
      startsWith(github.event.pull_request.title, 'chore: release')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 2

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.22.0'
          cache: 'pnpm'

      - name: Upgrade npm
        run: npm install -g npm@latest

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build package
        run: pnpm build

      - name: Publish to npm with OIDC
        run: |
          npm --version
          pnpm exec changeset publish --no-git-tag

      - name: Create GitHub Releases
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          for package_dir in lib studio; do
            package_name=$(node -p "require('./${package_dir}/package.json').name")
            version=$(node -p "require('./${package_dir}/package.json').version")
            previous_version=$(git show "${GITHUB_SHA}^:${package_dir}/package.json" | node -p "JSON.parse(require('fs').readFileSync(0, 'utf8')).version")
            if [ "$version" = "$previous_version" ]; then
              continue
            fi
            tag="${package_name}@${version}"
            if gh release view "$tag" > /dev/null 2>&1; then
              continue
            fi

            if [ -f "$package_dir/CHANGELOG.md" ]; then
              notes=$(awk '/^## /{if (found) exit; found=1; next} found' "$package_dir/CHANGELOG.md")
            else
              notes="Release version ${version}"
            fi

            gh release create "$tag" --target "$GITHUB_SHA" \
              --title "${package_name} v${version}" \
              --notes "$notes"
          done
