packages:
  - 'lib'
  - 'examples'
  - 'tests/*'
  - 'extension'
  - 'studio-ui'
  - 'e2e'

allowBuilds:
  '@vscode/vsce-sign': true
  esbuild: true
  keytar: true
  lefthook: true

minimumReleaseAge: 4320
minimumReleaseAgeExclude:
  # Not held back: every release of these is younger than the cutoff, so no mature one exists to pin
  - e2e
  - '@e2e-dev/web'

enableGlobalVirtualStore: true

overrides:
  serialize-javascript: '>=7.1.2'
